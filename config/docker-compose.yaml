services:
  hecinbox:
    # HEC-RAS Linux engine is x86_64 only.
    platform: linux/amd64
    build:
      context: ..
      dockerfile: Dockerfile
      platforms:
        - linux/amd64
    image: hecinbox:latest
    working_dir: /app
    ports:
      - "8501:8501"
    environment:
      TZ: UTC
      PYTHONUNBUFFERED: "1"
      SETTINGS_PATH: /app/settings.yml
      HECRAS_ENGINE_DIR: /app/hecras_engine
      HOST_ROOT: /host
      OUTPUTS_ROOT: /host_out
      OUTPUT_DIR: /app/data/outputs
      KEEP_WORKSPACE: "0"
    volumes:
      # Mount the user's home directory read-only so the web UI
      # can browse to any HEC-RAS model on the host machine.
      - ~/:/host:ro

      # Writable outputs root — the UI lets users pick/create a
      # subfolder here.  The container can ONLY write inside this tree.
      - ~/HEC-RAS-Outputs:/host_out

      # Default outputs (fallback for headless CLI mode).
      - ../results:/app/data/outputs

      # Optional: override default settings for headless CLI mode.
      # Not mounted :ro — the Streamlit UI writes settings at runtime.
      - ./settings.yaml:/app/settings.yml

    # Default: web UI.  Override with `command: ["python", "-m", "main"]`
    # for headless CLI mode.
